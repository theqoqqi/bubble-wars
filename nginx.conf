# Nginx reverse proxy configuration for Bubble Wars
# Place this in /etc/nginx/sites-available/bubble-wars and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com; # Replace with your domain or VPS IP

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
